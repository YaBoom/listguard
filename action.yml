name: 'listguard-compliance-gate'
description: 'Run listguard listing compliance audit as a CI gate'
author: 'ZhuYT'

inputs:
  path:
    description: 'Listing JSON file or directory to audit'
    required: true
    default: 'listings/'
  platform:
    description: 'amazon / temu / tiktok'
    required: true
  fail-on:
    description: 'red / yellow / never'
    required: false
    default: 'red'
  format:
    description: 'text / json / sarif'
    required: false
    default: 'sarif'

runs:
  using: 'composite'
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Build listguard
      shell: bash
      run: mvn -B -q -DskipTests package
    - name: Run compliance gate
      shell: bash
      env:
        LG_PATH: ${{ inputs.path }}
        LG_PLATFORM: ${{ inputs.platform }}
        LG_FORMAT: ${{ inputs.format }}
        LG_FAIL_ON: ${{ inputs.fail-on }}
      run: java -jar target/listguard.jar check "$LG_PATH" --platform "$LG_PLATFORM" --format "$LG_FORMAT" --fail-on "$LG_FAIL_ON"
