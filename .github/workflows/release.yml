name: Release

# GitHub Marketplace 上架 GitHub Action 的硬前置条件是「仓库有 published release」。
# 因此打 v* 标签即自动构建 jar、跑测试、建 Release 并附上可执行产物。
# 这样用户不必装 JDK 与 Maven，下载 jar 就能用——把试用门槛从「配环境」降到「下文件」。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（例如 v0.2.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and run Java tests
        run: mvn -B verify

      - name: Package executable jar
        run: mvn -B -DskipTests package

      # 发布前必须证明网页引擎与 CLI 仍一致、规则包两份数据未漂移。
      # 规则或引擎任何一侧改动后漏跑，用户会拿到「网页版和 CI 结论不同」的工具。
      - name: Verify web engine parity
        run: node web/tests/engine-parity.test.mjs

      - name: Verify rule pack sync
        run: node web/tests/rulepack-sync.test.mjs

      - name: Verify MCP server
        run: node mcp/server.test.mjs

      - name: Prepare assets
        run: |
          set -euo pipefail
          test -f target/listguard.jar
          mkdir -p dist
          cp target/listguard.jar dist/listguard.jar
          sha256sum dist/listguard.jar > dist/listguard.jar.sha256
          cat dist/listguard.jar.sha256

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: listguard ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: |
            dist/listguard.jar
            dist/listguard.jar.sha256
          body: |
            ## 安装

            下载 `listguard.jar`（需要 JDK 21+，无需 Maven）：

            ```bash
            java -jar listguard.jar check listings/ --platform amazon --fail-on yellow
            ```

            ## 其他使用方式

            - **在线检测台**（无需安装，纯浏览器本地计算）：见仓库 GitHub Pages 部署地址
            - **GitHub Action**：`uses: <owner>/<repo>@${{ steps.tag.outputs.value }}`，见 `action.yml`
            - **MCP server**（供 AI agent 调用）：`node mcp/server.mjs`，零依赖

            ## 质量校验

            本版本发布前已通过：Java 单元测试、网页引擎与 CLI 差分测试（52 项断言）、
            规则包 YAML 与网页副本同步校验、MCP 协议测试（40 项断言）。

            ## 校验和

            见 `listguard.jar.sha256`。
