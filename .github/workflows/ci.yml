name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: Java engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: listguard-jar
          path: target/listguard.jar

  # 网页版引擎是 Java 实现的移植，必须持续证明两者语义一致。
  # 规则或引擎任何一侧改动后，这个 job 是唯一的裁判：命中项、分级、字段、
  # 建议文本与闸门退出码逐条比对，不一致即失败。
  parity:
    name: Web engine parity
    runs-on: ubuntu-latest
    needs: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build jar
        run: mvn -B -DskipTests package
      - name: Diff Java CLI vs JS engine
        run: node web/tests/engine-parity.test.mjs

  # 规则包 YAML 与网页端规则副本是两份数据，必须防止只改一边导致规则漂移。
  rules-sync:
    name: Rule pack sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare YAML rule packs with web/assets/rulepacks.js
        run: node web/tests/rulepack-sync.test.mjs
